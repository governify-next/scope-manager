# ──────────────────────────────────────────────
# Reusable components
# ──────────────────────────────────────────────
components:
    # ── Security Schemes ─────────────────────────
    securitySchemes:
        BearerAuth:
            type: http
            scheme: bearer
            bearerFormat: JWT
            description: JWT bearer token

    # ── Parameters ────────────────────────────────
    parameters:
        orgName:
            name: orgName
            in: path
            required: true
            description: Unique name of the organization
            schema:
                type: string
            example: universidad-sevilla
        paginationPage:
            name: page
            in: query
            required: false
            description: Page number. Must be a positive integer. Defaults to 1.
            schema:
                type: integer
                minimum: 1
                default: 1
            example: 1
        paginationLimit:
            name: limit
            in: query
            required: false
            description: Number of results per page. Must be an integer between 1 and 100. Defaults to 10.
            schema:
                type: integer
                minimum: 1
                maximum: 100
                default: 10
            example: 10
        roleName:
            name: roleName
            in: path
            required: true
            description: Name of the role within the organization
            schema:
                type: string
            example: member
        scopeFieldName:
            name: fieldName
            in: path
            required: true
            description: Name of the scope field
            schema:
                type: string
            example: class
        agreementFieldName:
            name: fieldName
            in: path
            required: true
            description: Name of the agreement field
            schema:
                type: string
            example: minResponseTime
        memberUsername:
            name: username
            in: path
            required: true
            description: Username of the member to remove
            schema:
                type: string
            example: janedoe
        scopeName:
            name: scopeName
            in: path
            required: true
            description: Unique name of the scope within the organization
            schema:
                type: string
            example: gii-is-g1
        permissionName:
            name: permissionName
            in: path
            required: true
            description: Permission type (view, edit, delete, create)
            schema:
                type: string
                enum: [view, edit, delete, create]
            example: view

    # ── Request Bodies ────────────────────────────
    requestBodies:
        OrganizationBody:
            description: |
                Data to create or update an organization.
                `name` is required, must be 3-100 characters and can only contain letters, numbers and hyphens.
                `displayName` is optional and must be at most 200 characters.
                `description` is required and must be 3-500 characters.
            required: true
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/OrganizationInput'
                    example:
                        name: universidad-sevilla
                        displayName: Universidad de Sevilla
                        description: Organization for Universidad de Sevilla
        OrganizationSearchBody:
            description: |
                Optional filters to search organizations by name, displayName or both.
                `nameOrDisplayName` searches across name and displayName and must be 1-200 characters.
                `name` must be 1-100 characters.
                `displayName` must be 1-200 characters.
            required: false
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/OrganizationSearchFilters'
                    examples:
                        byNameOrDisplayName:
                            summary: Search by name or displayName
                            value:
                                nameOrDisplayName: sevilla
                        byName:
                            summary: Search by name
                            value:
                                name: universidad-sevilla
                        byDisplayName:
                            summary: Search by displayName
                            value:
                                displayName: Universidad de Sevilla
                        byNameAndDisplayName:
                            summary: Search by name and displayName
                            value:
                                name: universidad
                                displayName: Sevilla
        RoleBody:
            description: |
                Data to create or update a role.
                `name` and `description` are required strings.
                `name` must be 3-100 characters and `description` must be 3-500 characters.
            required: true
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/RoleInput'
                    example:
                        name: member
                        description: Organization member
        MemberRolesBody:
            description: |
                Role names that must replace the member's current roles.
                If the member is the organization creator, `admin` must be included.
            required: true
            content:
                application/json:
                    schema:
                        type: array
                        description: Array of role names
                        uniqueItems: true
                        items:
                            type: string
                        example:
                            - admin
                            - member
        FieldBody:
            description: |
                Data to create or update a scope field.
                `name`, `description` and `type` are required.
                `name` must be 3-100 characters and `description` must be 3-500 characters.
                If `type` is `enum`, the `value` field is required and must be an array.
                For any other type, `value` must not be sent.
            required: true
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/ScopeFieldInput'
                    examples:
                        enumField:
                            summary: Enum type field
                            value:
                                name: class
                                description: Project class
                                type: enum
                                value:
                                    - PSG1
                                    - PSG2
                                    - PSG3
                        stringField:
                            summary: String type field
                            value:
                                name: title
                                description: Scope title
                                type: string
        AgreementFieldBody:
            description: |
                Data to create or update an agreement field.
                `name`, `description` and `type` are required.
                `name` must be 3-100 characters and `description` must be 3-500 characters.
                If `type` is `enum`, the `value` field is required and must be an array.
                For any other type, `value` must not be sent.
            required: true
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/AgreementFieldInput'
                    examples:
                        numericField:
                            summary: Numeric guarantee field
                            value:
                                name: minResponseTime
                                description: Minimum response time in hours
                                type: number
                        enumField:
                            summary: Enum guarantee level field
                            value:
                                name: guaranteeLevel
                                description: Service level guarantee tier
                                type: enum
                                value:
                                    - gold
                                    - silver
                                    - bronze

        MemberBody:
            description: Data to add a user to an organization. The username must belong to an existing user and cannot already be a member of the organization.
            required: true
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/MemberInput'
                    example:
                        username: janedoe

        ScopeBody:
            description: |
                Data to create or update a scope.
                `name`, `type`, `fields`, `permissions` and `config` are required.
                `name` must be a string between 2 and 100 characters.
                `description` is optional and must be a string between 3 and 500 characters.
                `fields` must be an array, `permissions` and `config` must be objects.
                `parentId` is only used on creation and must reference an existing scope
                of the same organization; leave it out to create a root scope.
                Each field name must exist in the organization's scopeFields.
                Each permission value must be an array of role names that exist in the organization.
            required: true
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/ScopeInput'
                    examples:
                        rootScope:
                            summary: New organization as a root scope
                            value:
                                name: psg2-2526
                                description: Curso PSG2 año 2025/2026
                                type: Organizations
                                fields: []
                                permissions:
                                    view: []
                                    edit: []
                                    delete: []
                                    create: []
                                config:
                                    owner: gii-is-psg2
                                    token: your-token-here-25/26
                        childScope:
                            summary: New repository under an existing organization
                            value:
                                name: gii-is-g2
                                description: Repositorio del grupo 2 de la asignatura
                                type: Repositories
                                parentId: 665a2b3c4d5e6f7a8b9c0d1e
                                fields: []
                                permissions:
                                    view: []
                                    edit: []
                                    delete: []
                                    create: []
                                config:
                                    repository: psg2-2425-g2

        ScopesTreeBody:
            description: |
                Array of root scopes to create, each one nesting its descendants inside
                its `children` array. A leaf scope declares an empty `children` array.
                `parentId` must not be sent: the server generates the identifiers while
                walking the tree.
                `fields` and `permissions` are not accepted either: every scope is created
                with them empty and they are managed from the individual scope endpoints.
            required: true
            content:
                application/json:
                    schema:
                        type: array
                        items:
                            $ref: '#/components/schemas/ScopeNodeInput'
                    example:
                        - name: psg2-2425
                          description: Curso PSG2 año 2024/2025
                          type: Organizations
                          config:
                              owner: gii-is-psg2
                              token: your-token-here-24/25
                          children:
