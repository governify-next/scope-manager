openapi: 3.0.0
info:
    title: Scope manager API
    version: 1.0.0
    description: |
        REST API for managing organizations, their roles, element fields
        and agreement fields within Scope manager API.

        Each organization is the main container in the system: it groups elements,
        defines the vocabulary they must follow and establishes the available roles.
servers:
    - url: /

tags:
    - name: Health
      description: Server health check
    - name: Organizations
      description: Organization management
    - name: Organizations Roles
      description: Role management within an organization
    - name: Organizations ElementFields
      description: Fields that define the structure of an organization's elements
    - name: Organizations AgreementFields
      description: Fields that define the structure of an organization's agreements
    - name: Organizations Members
      description: Member management within an organization
    - name: Elements
      description: Element management within an organization
    - name: ElementParts
      description: Part management within an element
    - name: ElementPermissions
      description: Permission management within an element

paths:
    # ──────────────────────────────────────────────
    # Health
    # ──────────────────────────────────────────────
    /health:
        get:
            tags:
                - Health
            summary: Health check
            description: Returns the server health status. This endpoint does not use the standard response wrapper.
            responses:
                '200':
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    status:
                                        type: string

    # ──────────────────────────────────────────────
    # Organizations
    # ──────────────────────────────────────────────
    /api/v1/organizations:
        get:
            tags:
                - Organizations
            summary: List all organizations
            operationId: getOrganizations
            security:
                - BearerAuth: []
            description: |
                Returns a paginated array with organizations registered in the system.
                Requires an authenticated user with system ADMIN role.
                Each organization includes its roles, element fields, agreement fields and members count.
            parameters:
                - $ref: '#/components/parameters/paginationPage'
                - $ref: '#/components/parameters/paginationLimit'
            responses:
                '200':
                    description: List of organizations retrieved successfully
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/OrganizationsResponse'
                            example:
                                success: true
                                message: OK
                                httpStatus: 200
                                appCode: SUCCESS
                                data:
                                    - _id: 665a1b2c3d4e5f6a7b8c9d0e
                                      name: universidad-sevilla
                                      displayName: Universidad de Sevilla
                                      description: Organization for Universidad de Sevilla
                                      createdBy: 665d4e5f6a7b8c9d0e1f2a3b
                                      elementFields: []
                                      agreementFields: []
                                      roles:
                                          - _id: 665b2c3d4e5f6a7b8c9d0e1f
                                            name: admin
                                            description: Organization Administrator
                                      members: 1
                                      createdAt: '2025-06-01T10:00:00.000Z'
                                      updatedAt: '2025-06-01T10:00:00.000Z'
                                      __v: 0
                                pagination:
                                    page: 1
                                    limit: 20
                                    totalItems: 1
                                    totalPages: 1
                                    hasNextPage: false
                                    hasPreviousPage: false
                                error: null
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '500':
                    $ref: '#/components/responses/InternalError'
        post:
            tags:
                - Organizations
            summary: Create an organization
            operationId: createOrganization
            security:
                - BearerAuth: []
            description: |
                Creates a new organization with a unique name, optional displayName and description.
                Requires an authenticated user with system ADMIN role.
                The organization is created with a default 'admin' role, stores the creator id
                and automatically assigns the creator as organization admin.
                The elementFields and agreementFields arrays are initialized empty.
            requestBody:
                $ref: '#/components/requestBodies/OrganizationBody'
            responses:
                '201':
                    description: Organization created successfully
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/OrganizationResponse'
                            example:
                                success: true
                                message: Organization created
                                httpStatus: 201
                                appCode: SUCCESS
                                data:
                                    _id: 665a1b2c3d4e5f6a7b8c9d0e
                                    name: universidad-sevilla
                                    displayName: Universidad de Sevilla
                                    description: Organization for Universidad de Sevilla
                                    createdBy: 665d4e5f6a7b8c9d0e1f2a3b
                                    elementFields: []
                                    agreementFields: []
                                    roles:
                                        - _id: 665b2c3d4e5f6a7b8c9d0e1f
                                          name: admin
                                          description: Organization Administrator
                                    createdAt: '2025-06-01T10:00:00.000Z'
                                    updatedAt: '2025-06-01T10:00:00.000Z'
                                    __v: 0
                                error: null
                '400':
                    $ref: '#/components/responses/ValidationError'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '409':
                    $ref: '#/components/responses/OrganizationConflict'
                '500':
                    $ref: '#/components/responses/InternalError'

    /api/v1/organizations/search:
        post:
            tags:
                - Organizations
            summary: Search organizations
            operationId: searchOrganizations
            security:
                - BearerAuth: []
            description: |
                Searches organizations using optional text filters and pagination.
                Requires an authenticated user.
                Filters can target name, displayName or both.
                Users with system ADMIN role search across all organizations.
                Non-admin users only search organizations where they are members.
                Each organization includes its members count.
            parameters:
                - $ref: '#/components/parameters/paginationPage'
                - $ref: '#/components/parameters/paginationLimit'
            requestBody:
                $ref: '#/components/requestBodies/OrganizationSearchBody'
            responses:
                '200':
                    description: Organizations matching the search filters
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/OrganizationsResponse'
                            example:
                                success: true
                                message: OK
                                httpStatus: 200
                                appCode: SUCCESS
                                data:
                                    - _id: 665a1b2c3d4e5f6a7b8c9d0e
                                      name: universidad-sevilla
                                      displayName: Universidad de Sevilla
                                      description: Organization for Universidad de Sevilla
                                      createdBy: 665d4e5f6a7b8c9d0e1f2a3b
                                      elementFields: []
                                      agreementFields: []
                                      roles:
                                          - _id: 665b2c3d4e5f6a7b8c9d0e1f
                                            name: admin
                                            description: Organization Administrator
                                      members: 1
                                      createdAt: '2025-06-01T10:00:00.000Z'
                                      updatedAt: '2025-06-01T10:00:00.000Z'
                                      __v: 0
                                pagination:
                                    page: 1
                                    limit: 20
                                    totalItems: 1
                                    totalPages: 1
                                    hasNextPage: false
                                    hasPreviousPage: false
                                error: null
                '400':
                    $ref: '#/components/responses/ValidationError'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '500':
                    $ref: '#/components/responses/InternalError'

    /api/v1/organizations/{orgName}:
        parameters:
            - $ref: '#/components/parameters/orgName'
        get:
            tags:
                - Organizations
            summary: Get an organization by name
            operationId: getOrganizationByName
            security:
                - BearerAuth: []
            description: |
                Returns the full organization identified by its unique name,
                including its roles, element fields, agreement fields and members count.
                Requires an authenticated user that is either a member of the organization
                or has system ADMIN role.
            responses:
                '200':
                    description: Organization found
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/OrganizationResponse'
                            example:
                                success: true
                                message: OK
                                httpStatus: 200
                                appCode: SUCCESS
                                data:
                                    _id: 665a1b2c3d4e5f6a7b8c9d0e
                                    name: universidad-sevilla
                                    displayName: Universidad de Sevilla
                                    description: Organization for Universidad de Sevilla
                                    createdBy: 665d4e5f6a7b8c9d0e1f2a3b
                                    elementFields: []
                                    agreementFields: []
                                    roles:
                                        - _id: 665b2c3d4e5f6a7b8c9d0e1f
                                          name: admin
                                          description: Organization Administrator
                                    members: 1
                                    createdAt: '2025-06-01T10:00:00.000Z'
                                    updatedAt: '2025-06-01T10:00:00.000Z'
                                    __v: 0
                                error: null
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '404':
                    $ref: '#/components/responses/OrganizationNotFound'
                '500':
                    $ref: '#/components/responses/InternalError'
        put:
            tags:
                - Organizations
            summary: Update an organization
            operationId: updateOrganization
            security:
                - BearerAuth: []
            description: |
                Updates the name, displayName and description of an existing organization.
                Requires organization admin role or system ADMIN role.
                If the name is changed, the new name must be unique in the system.
                The request body is validated with the same required fields as creation.
            requestBody:
                $ref: '#/components/requestBodies/OrganizationBody'
            responses:
                '200':
                    description: Organization updated successfully
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/OrganizationResponse'
                '400':
                    $ref: '#/components/responses/ValidationError'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '404':
                    $ref: '#/components/responses/NotFound'
                '409':
                    $ref: '#/components/responses/OrganizationConflict'
                '500':
                    $ref: '#/components/responses/InternalError'
        delete:
            tags:
                - Organizations
            summary: Delete an organization
            operationId: deleteOrganization
            security:
                - BearerAuth: []
            description: |
                Permanently deletes the organization and all its associated data.
                Requires organization admin role or system ADMIN role.
                Memberships and elements belonging to the organization are removed before the organization.
            responses:
                '200':
                    description: Organization deleted successfully
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/NullResponse'
                            example:
                                success: true
                                message: Organization deleted
                                httpStatus: 200
                                appCode: SUCCESS
                                data: null
                                error: null
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '404':
                    $ref: '#/components/responses/NotFound'
                '500':
                    $ref: '#/components/responses/InternalError'

    # ──────────────────────────────────────────────
    # Roles
    # ──────────────────────────────────────────────
    /api/v1/organizations/{orgName}/roles:
        parameters:
            - $ref: '#/components/parameters/orgName'
        post:
            tags:
                - Organizations Roles
            summary: Add a role to the organization
            operationId: addRole
            security:
                - BearerAuth: []
            description: |
                Adds a new role to the specified organization.
                Requires organization admin role or system ADMIN role.
                The role body must include name and description.
                The role name must be unique within the organization.
                There is a maximum role limit per organization (default 100).
            requestBody:
                $ref: '#/components/requestBodies/RoleBody'
            responses:
                '201':
                    description: Role added successfully. Returns the updated organization.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/OrganizationResponse'
                '400':
                    $ref: '#/components/responses/ValidationError'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '404':
                    $ref: '#/components/responses/NotFound'
                '409':
                    $ref: '#/components/responses/RoleConflict'
                '500':
                    $ref: '#/components/responses/InternalError'

    /api/v1/organizations/{orgName}/roles/{roleName}:
        parameters:
            - $ref: '#/components/parameters/orgName'
            - $ref: '#/components/parameters/roleName'
        put:
            tags:
                - Organizations Roles
            summary: Update a role
            operationId: updateRole
            security:
                - BearerAuth: []
            description: |
                Updates the name and/or description of an existing role.
                Requires organization admin role or system ADMIN role.
                The built-in 'admin' role cannot be modified.
                If the name is changed, the new name must be unique within the organization.
                The role body must include name and description.
            requestBody:
                $ref: '#/components/requestBodies/RoleBody'
            responses:
                '200':
                    description: Role updated successfully. Returns the updated organization.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/OrganizationResponse'
                '400':
                    $ref: '#/components/responses/ValidationError'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '404':
                    $ref: '#/components/responses/RoleNotFound'
                '409':
                    $ref: '#/components/responses/RoleConflict'
                '500':
                    $ref: '#/components/responses/InternalError'
        delete:
            tags:
                - Organizations Roles
            summary: Delete a role
            operationId: deleteRole
            security:
                - BearerAuth: []
            description: |
                Removes a role from the organization.
                Requires organization admin role or system ADMIN role.
                The built-in 'admin' role cannot be deleted.
                This operation also removes the role from associated memberships and deletes
                memberships that are left without roles.
            responses:
                '200':
                    description: Role deleted successfully. Returns the updated organization.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/OrganizationResponse'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '404':
                    $ref: '#/components/responses/RoleNotFound'
                '500':
                    $ref: '#/components/responses/InternalError'

    # ──────────────────────────────────────────────
    # Element Fields
    # ──────────────────────────────────────────────
    /api/v1/organizations/{orgName}/elementFields:
        parameters:
            - $ref: '#/components/parameters/orgName'
        post:
            tags:
                - Organizations ElementFields
            summary: Add an element field
            operationId: addElementField
            security:
                - BearerAuth: []
            description: |
                Adds a new field to the organization's element definition.
                Requires organization admin role or system ADMIN role.
                The field body must include name, description and type.
                Type must be one of `string`, `enum` or `number`.
                If type is `enum`, value must be an array; otherwise value must not be sent.
                This field becomes part of the structure that elements belonging
                to this organization must follow.
            requestBody:
                $ref: '#/components/requestBodies/FieldBody'
            responses:
                '201':
                    description: Element field added. Returns the updated organization.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/OrganizationResponse'
                '400':
                    $ref: '#/components/responses/ValidationError'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '404':
                    $ref: '#/components/responses/OrganizationNotFound'
                '409':
                    $ref: '#/components/responses/ElementFieldConflict'
                '500':
                    $ref: '#/components/responses/InternalError'

    /api/v1/organizations/{orgName}/elementFields/{fieldName}:
        parameters:
            - $ref: '#/components/parameters/orgName'
            - $ref: '#/components/parameters/elementFieldName'
        put:
            tags:
                - Organizations ElementFields
            summary: Update an element field
            operationId: updateElementField
            security:
                - BearerAuth: []
            description: |
                Updates an existing element field.
                Requires organization admin role or system ADMIN role.
                The existing field must belong to the organization's elementFields.
                The field body must include name, description and type.
                Type must be one of `string`, `enum` or `number`.
                If type is `enum`, value must be an array; otherwise value must not be sent.
                If the name is changed, the new name must be unique within the
                organization's elementFields.
            requestBody:
                $ref: '#/components/requestBodies/FieldBody'
            responses:
                '200':
                    description: Element field updated. Returns the updated organization.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/OrganizationResponse'
                '400':
                    $ref: '#/components/responses/ValidationError'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '404':
                    $ref: '#/components/responses/ElementFieldNotFound'
                '409':
                    $ref: '#/components/responses/ElementFieldConflict'
                '500':
                    $ref: '#/components/responses/InternalError'
        delete:
            tags:
                - Organizations ElementFields
            summary: Delete an element field
            operationId: deleteElementField
            security:
                - BearerAuth: []
            description: |
                Removes a field from the organization's element definition.
                Requires organization admin role or system ADMIN role.
                The field must exist in the organization's elementFields.
            responses:
                '200':
                    description: Element field deleted. Returns the updated organization.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/OrganizationResponse'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '404':
                    $ref: '#/components/responses/ElementFieldNotFound'
                '500':
                    $ref: '#/components/responses/InternalError'

    # ──────────────────────────────────────────────
    # Agreement Fields
    # ──────────────────────────────────────────────
    /api/v1/organizations/{orgName}/agreementFields:
        parameters:
            - $ref: '#/components/parameters/orgName'
        post:
            tags:
                - Organizations AgreementFields
            summary: Add an agreement field
            operationId: addAgreementField
            security:
                - BearerAuth: []
            description: |
                Adds a new field to the organization's agreement definition.
                Requires organization admin role or system ADMIN role.
                The field body must include name, description and type.
                Type must be one of `string`, `enum` or `number`.
                If type is `enum`, value must be an array; otherwise value must not be sent.
                This field becomes part of the structure that agreements associated
                with this organization's elements must follow.
            requestBody:
                $ref: '#/components/requestBodies/AgreementFieldBody'
            responses:
                '201':
                    description: Agreement field added. Returns the updated organization.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/OrganizationResponse'
                '400':
                    $ref: '#/components/responses/ValidationError'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '404':
                    $ref: '#/components/responses/OrganizationNotFound'
                '409':
                    $ref: '#/components/responses/AgreementFieldConflict'
                '500':
                    $ref: '#/components/responses/InternalError'

    /api/v1/organizations/{orgName}/agreementFields/{fieldName}:
        parameters:
            - $ref: '#/components/parameters/orgName'
            - $ref: '#/components/parameters/agreementFieldName'
        put:
            tags:
                - Organizations AgreementFields
            summary: Update an agreement field
            operationId: updateAgreementField
            security:
                - BearerAuth: []
            description: |
                Updates an existing agreement field.
                Requires organization admin role or system ADMIN role.
                The existing field must belong to the organization's agreementFields.
                The field body must include name, description and type.
                Type must be one of `string`, `enum` or `number`.
                If type is `enum`, value must be an array; otherwise value must not be sent.
                If the name is changed, the new name must be unique within the
                organization's agreementFields.
            requestBody:
                $ref: '#/components/requestBodies/AgreementFieldBody'
            responses:
                '200':
                    description: Agreement field updated. Returns the updated organization.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/OrganizationResponse'
                '400':
                    $ref: '#/components/responses/ValidationError'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '404':
                    $ref: '#/components/responses/AgreementFieldNotFound'
                '409':
                    $ref: '#/components/responses/AgreementFieldConflict'
                '500':
                    $ref: '#/components/responses/InternalError'
        delete:
            tags:
                - Organizations AgreementFields
            summary: Delete an agreement field
            operationId: deleteAgreementField
            security:
                - BearerAuth: []
            description: |
                Removes a field from the organization's agreement definition.
                Requires organization admin role or system ADMIN role.
                The field must exist in the organization's agreementFields.
            responses:
                '200':
                    description: Agreement field deleted. Returns the updated organization.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/OrganizationResponse'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '404':
                    $ref: '#/components/responses/AgreementFieldNotFound'
                '500':
                    $ref: '#/components/responses/InternalError'

    # ──────────────────────────────────────────────
    # Members
    # ──────────────────────────────────────────────
    /api/v1/organizations/{orgName}/members:
        parameters:
            - $ref: '#/components/parameters/orgName'
        get:
            tags:
                - Organizations Members
            summary: List members of an organization
            operationId: getMembers
            security:
                - BearerAuth: []
            description: |
                Returns the memberships of the specified organization.
                Requires organization admin role or system ADMIN role.
                Use the `expand` query parameter to control the level of detail:
                - `none` (default): returns raw ObjectIds

                - `full`: populates user, organization and role objects

                - `names`: populates only user username, organization name and role names
            parameters:
                - in: query
                  name: expand
                  required: false
                  description: Level of detail for the returned memberships
                  schema:
                      type: string
                      default: none
                      enum: [none, full, names]
            responses:
                '200':
                    description: List of members retrieved successfully
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/MembershipsResponse'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '404':
                    $ref: '#/components/responses/OrganizationNotFound'
                '500':
                    $ref: '#/components/responses/InternalError'
        post:
            tags:
                - Organizations Members
            summary: Add a user to the organization
            operationId: addUserToOrganization
            security:
                - BearerAuth: []
            description: |
                Adds an existing user as a member of the specified organization.
                Requires organization admin role or system ADMIN role.
                The user must exist in the system and must not already be a member.
                There is a maximum member limit per organization (default 1000).
            requestBody:
                $ref: '#/components/requestBodies/MemberBody'
            responses:
                '200':
                    description: User added to the organization successfully
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/MembershipResponse'
                            example:
                                success: true
                                message: User added to organization
                                httpStatus: 200
                                appCode: SUCCESS
                                data:
                                    _id: 665c3d4e5f6a7b8c9d0e1f2a
                                    organizationId: 665a1b2c3d4e5f6a7b8c9d0e
                                    userId: 665d4e5f6a7b8c9d0e1f2a3b
                                    rolesId: []
                                    createdAt: '2025-06-01T12:00:00.000Z'
                                    updatedAt: '2025-06-01T12:00:00.000Z'
                                    __v: 0
                                error: null
                '400':
                    $ref: '#/components/responses/ValidationError'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '404':
                    $ref: '#/components/responses/NotFound'
                '409':
                    $ref: '#/components/responses/MemberConflict'
                '500':
                    $ref: '#/components/responses/InternalError'

    /api/v1/organizations/{orgName}/members/me/admin:
        parameters:
            - $ref: '#/components/parameters/orgName'
        get:
            tags:
                - Organizations Members
            summary: Check if current member is organization admin
            operationId: isCurrentUserOrganizationAdmin
            security:
                - BearerAuth: []
            description: |
                Returns whether the authenticated user has the `admin` role in the organization.
                Requires the authenticated user to be a member of the organization or to have system ADMIN role.
                Users with system ADMIN role always receive `true`.
                Organization members receive `true` only when their membership includes the organization admin role.
            responses:
                '200':
                    description: Current user's organization admin status
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AdminStatusResponse'
                            example:
                                success: true
                                message: OK
                                httpStatus: 200
                                appCode: SUCCESS
                                data:
                                    isAdmin: true
                                error: null
                '401':
                    $ref: '#/components/responses/Unauthorized'
