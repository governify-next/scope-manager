    # ── Schemas ───────────────────────────────────
    schemas:
        # ── Standard response ────────────────────
        SuccessResponse:
            type: object
            description: Standard wrapper for all successful API responses
            properties:
                success:
                    type: boolean
                    example: true
                message:
                    type: string
                    example: OK
                httpStatus:
                    type: integer
                    example: 200
                appCode:
                    type: string
                    example: SUCCESS
                error:
                    type: object
                    nullable: true
                    example: null
            required:
                - success
                - message
                - httpStatus
                - appCode
                - data
                - error

        OrganizationResponse:
            allOf:
                - $ref: '#/components/schemas/SuccessResponse'
                - type: object
                  properties:
                      data:
                          $ref: '#/components/schemas/Organization'

        OrganizationsResponse:
            allOf:
                - $ref: '#/components/schemas/SuccessResponse'
                - type: object
                  properties:
                      data:
                          type: array
                          items:
                              $ref: '#/components/schemas/Organization'
                      pagination:
                          $ref: '#/components/schemas/Pagination'

        MembershipResponse:
            allOf:
                - $ref: '#/components/schemas/SuccessResponse'
                - type: object
                  properties:
                      data:
                          $ref: '#/components/schemas/Membership'

        MembershipsResponse:
            allOf:
                - $ref: '#/components/schemas/SuccessResponse'
                - type: object
                  properties:
                      data:
                          type: array
                          items:
                              $ref: '#/components/schemas/Membership'

        AdminStatusResponse:
            allOf:
                - $ref: '#/components/schemas/SuccessResponse'
                - type: object
                  properties:
                      data:
                          type: object
                          required:
                              - isAdmin
                          properties:
                              isAdmin:
                                  type: boolean
                                  description: True when the authenticated user is organization admin or system admin

        NullResponse:
            allOf:
                - $ref: '#/components/schemas/SuccessResponse'
                - type: object
                  properties:
                      data:
                          type: object
                          nullable: true
                          example: null

        ScopeResponse:
            allOf:
                - $ref: '#/components/schemas/SuccessResponse'
                - type: object
                  properties:
                      data:
                          $ref: '#/components/schemas/Scope'

        ScopesResponse:
            allOf:
                - $ref: '#/components/schemas/SuccessResponse'
                - type: object
                  properties:
                      data:
                          type: array
                          items:
                              $ref: '#/components/schemas/Scope'

        ErrorResponse:
            type: object
            description: Standard wrapper for all error API responses
            properties:
                success:
                    type: boolean
                    example: false
                message:
                    type: string
                httpStatus:
                    type: integer
                appCode:
                    type: string
                data:
                    type: object
                    nullable: true
                    example: null
                error:
                    type: object
                    properties:
                        message:
                            type: string
                        details:
                            description: Additional error information (may be null)
                            type: object
                            nullable: true
            required:
                - success
                - message
                - httpStatus
                - appCode
                - data
                - error

        Pagination:
            type: object
            description: Pagination metadata
            properties:
                page:
                    type: integer
                    example: 1
                limit:
                    type: integer
                    minimum: 1
                    maximum: 100
                    example: 10
                totalItems:
                    type: integer
                    example: 1
                totalPages:
                    type: integer
                    example: 1
                hasNextPage:
                    type: boolean
                    example: false
                hasPreviousPage:
                    type: boolean
                    example: false
            required:
                - page
                - limit
                - totalItems
                - totalPages
                - hasNextPage
                - hasPreviousPage

        # ── Organization ─────────────────────────
        Organization:
            type: object
            description: |
                Main container of the system. Defines the structure of its scopes,
                the structure of its agreements and the available roles.
            required:
                - _id
                - name
                - description
                - createdBy
                - scopeFields
                - agreementFields
                - roles
            properties:
                _id:
                    type: string
                    description: MongoDB internal identifier (ObjectId)
                    example: 665a1b2c3d4e5f6a7b8c9d0e
                name:
                    type: string
                    description: Unique organization name (used as identifier in the API). Only letters, numbers and hyphens allowed.
                    pattern: '^[a-zA-Z0-9-]+$'
                    minLength: 3
                    maxLength: 100
                    example: universidad-sevilla
                displayName:
                    type: string
                    description: Human-readable display name. Can contain any characters. Defaults to empty string.
                    maxLength: 200
                    default: ''
                    example: Universidad de Sevilla
                description:
                    type: string
                    description: Organization description
                    minLength: 3
                    maxLength: 500
                    example: Organization for Universidad de Sevilla
                createdBy:
                    type: string
                    description: ObjectId of the user that created the organization
                    example: 665d4e5f6a7b8c9d0e1f2a3b
                scopeFields:
                    type: array
                    description: Fields that define the structure of scopes
                    items:
                        $ref: '#/components/schemas/ScopeField'
                agreementFields:
                    type: array
                    description: Fields that define the structure of agreements
                    items:
                        $ref: '#/components/schemas/AgreementField'
                roles:
                    type: array
                    description: Available roles within the organization
                    items:
                        $ref: '#/components/schemas/Role'
                members:
                    type: integer
                    description: Number of members in the organization
                    example: 1
                createdAt:
                    type: string
                    format: date-time
                    description: Creation date (auto-generated by Mongoose)
                updatedAt:
                    type: string
                    format: date-time
                    description: Last update date (auto-generated by Mongoose)
                __v:
                    type: integer
                    description: Mongoose version key
                    example: 0

        OrganizationInput:
            type: object
            description: Data required to create or update an organization
            required:
                - name
                - description
            properties:
                name:
                    type: string
                    description: Unique organization name. Only letters, numbers and hyphens allowed.
                    pattern: '^[a-zA-Z0-9-]+$'
                    minLength: 3
                    maxLength: 100
                    example: universidad-sevilla
                displayName:
                    type: string
                    description: Human-readable display name. Can contain any characters.
                    maxLength: 200
                    example: Universidad de Sevilla
                description:
                    type: string
                    description: Organization description
                    minLength: 3
                    maxLength: 500
                    example: Organization for Universidad de Sevilla

        OrganizationSearchFilters:
            type: object
            description: Optional filters available when searching organizations
            properties:
                nameOrDisplayName:
                    type: string
                    description: Case-insensitive filter applied to organization name or displayName
                    minLength: 1
                    maxLength: 200
                    example: sevilla
                name:
                    type: string
                    description: Case-insensitive filter applied to organization name
                    minLength: 1
                    maxLength: 100
                    example: universidad
                displayName:
                    type: string
                    description: Case-insensitive filter applied to displayName
                    minLength: 1
                    maxLength: 200
                    example: Sevilla

        # ── Role ─────────────────────────────────
        Role:
            type: object
            description: Role within an organization (e.g. admin, teacher, student)
            required:
                - _id
                - name
                - description
            properties:
                _id:
                    type: string
                    description: MongoDB internal identifier (subdocument ObjectId)
                    example: 665b2c3d4e5f6a7b8c9d0e1f
                name:
                    type: string
                    description: Role name (unique within the organization)
                    minLength: 3
                    maxLength: 100
                    example: admin
                description:
                    type: string
                    description: Role description
                    minLength: 3
                    maxLength: 500
                    example: Organization administrator

        RoleInput:
            type: object
            description: Data required to create or update a role
            required:
                - name
                - description
            properties:
                name:
                    type: string
                    description: Role name (unique within the organization)
                    minLength: 3
                    maxLength: 100
                    example: admin
                description:
                    type: string
                    description: Role description
                    minLength: 3
                    maxLength: 500
                    example: Organization administrator

        # ── Membership ──────────────────────────
        Membership:
            type: object
            description: Represents the relationship between a user and an organization
            required:
                - _id
                - organizationId
                - userId
                - rolesId
            properties:
                _id:
                    type: string
                    description: MongoDB internal identifier (ObjectId)
                    example: 665c3d4e5f6a7b8c9d0e1f2a
                organizationId:
                    type: string
                    description: Organization ObjectId reference
                    example: 665a1b2c3d4e5f6a7b8c9d0e
                userId:
                    type: string
                    description: User ObjectId reference
                    example: 665d4e5f6a7b8c9d0e1f2a3b
                rolesId:
                    type: array
                    description: Array of Role ObjectId references assigned to the user
                    items:
                        type: string
                    example: []
                createdAt:
                    type: string
                    format: date-time
                    description: Creation date (auto-generated by Mongoose)
                updatedAt:
                    type: string
                    format: date-time
                    description: Last update date (auto-generated by Mongoose)
                __v:
                    type: integer
                    description: Mongoose version key
                    example: 0

        MemberInput:
            type: object
            description: Data required to add a user to an organization
            required:
                - username
            properties:
                username:
                    type: string
                    description: Username of the user to add
                    example: janedoe

        # ── Scope ───────────────────────────────
        Scope:
            type: object
            description: |
                A scope within an organization (e.g. a class or a team).
                Scopes are hierarchical: `parentId` references the scope above and is
                absent on root scopes.
            required:
                - _id
                - name
                - type
                - organizationId
            properties:
                _id:
                    type: string
                    description: MongoDB internal identifier (ObjectId)
                    example: 665b1c2d3e4f5a6b7c8d9e0f
                name:
                    type: string
                    description: Unique scope name within the organization
                    example: gii-is-g1
                description:
                    type: string
                    example: Repositorio del grupo 1 de la asignatura
                type:
                    type: string
                    description: Scope type within the organization hierarchy
                    example: Repositories
                organizationId:
                    type: string
                    description: Organization ObjectId reference
                    example: 665a1b2c3d4e5f6a7b8c9d0e
                parentId:
                    type: string
                    description: Parent scope ObjectId reference. Absent on root scopes.
                    example: 665a2b3c4d5e6f7a8b9c0d1e
                fields:
                    type: array
                    description: Scope field values (their names must match the organization's scopeFields)
                    items:
                        type: object
                    example: []
                permissions:
                    type: object
                    description: Role-based permissions for this scope (arrays of role ObjectIds)
                config:
                    type: object
                    description: Configuration for this scope
                    example:
                        repository: psg2-2425-g1
                children:
                    type: array
                    description: Descendant scopes. Only present when the scopes are returned as a tree.
                    items:
                        $ref: '#/components/schemas/Scope'
                createdAt:
                    type: string
                    format: date-time
                updatedAt:
                    type: string
                    format: date-time
                __v:
                    type: integer
                    example: 0

        ScopeInput:
            type: object
            description: Payload for creating or updating a scope
            required:
                - name
                - type
                - fields
                - permissions
                - config
            properties:
                name:
                    type: string
                    minLength: 2
                    maxLength: 100
                    example: gii-is-g1
                description:
                    type: string
                    minLength: 3
                    maxLength: 500
                    example: Repositorio del grupo 1 de la asignatura
                type:
                    type: string
                    example: Repositories
                parentId:
                    type: string
                    description: |
                        Parent scope ObjectId. Only used on creation and must reference an
                        existing scope of the same organization. Leave it out to create a root scope.
                    example: 665a2b3c4d5e6f7a8b9c0d1e
                fields:
                    type: array
                    items:
                        type: object
                    example: []
                permissions:
                    type: object
                    example:
                        view: []
                        edit: []
                        delete: []
                        create: []
                config:
                    type: object
                    example:
                        repository: psg2-2425-g1

        ScopeNodeInput:
            type: object
            description: |
                A scope inside a tree payload. The position in the hierarchy is expressed
                through `children` instead of `parentId`, which must not be sent.
                `fields` and `permissions` are not accepted here: they are handled from the
                individual scope endpoints and are initialized empty.
            required:
                - name
                - type
                - config
                - children
            properties:
                name:
                    type: string
                    minLength: 2
                    maxLength: 100
                    example: gii-is-g1
                description:
                    type: string
                    minLength: 3
                    maxLength: 500
                    example: Repositorio del grupo 1 de la asignatura
                type:
                    type: string
                    example: Repositories
                config:
                    type: object
                    example:
                        repository: psg2-2425-g1
                children:
                    type: array
                    description: Descendant scopes. Empty array on a leaf scope.
                    items:
                        $ref: '#/components/schemas/ScopeNodeInput'

        # ── Base field properties (shared) ──────
        FieldBase:
            type: object
            required:
                - name
                - description
                - type
            properties:
                name:
                    type: string
                    description: Field name (unique within its array)
                    minLength: 3
                    maxLength: 100
                description:
                    type: string
                    description: Field description
                    minLength: 3
                    maxLength: 500
                type:
                    type: string
                    description: Field type
                    enum:
                        - string
                        - enum
                        - number

        # ── ScopeField ───────────────────────────
        ScopeField:
            description: |
                Field that defines part of the structure of an organization's scopes.
                If `type` is `enum`, `value` contains the array of allowed values.
                For any other type, `value` is not present.
            oneOf:
                - title: Enum scope field
                  allOf:
                      - $ref: '#/components/schemas/FieldBase'
                      - type: object
                        required:
                            - value
                        properties:
                            value:
                                type: array
                                description: Allowed values for the enum field
                                items:
                                    type: string
                                example:
                                    - PSG1
                                    - PSG2
                                    - PSG3
                  example:
                      name: class
                      description: Project class
                      type: enum
                      value:
                          - PSG1
                          - PSG2
                          - PSG3
                - title: Non-enum scope field
                  allOf:
                      - $ref: '#/components/schemas/FieldBase'
                  example:
                      name: title
                      description: Scope title
                      type: string

        ScopeFieldInput:
            description: |
                Data to create or update a scope field.
                If `type` is `enum`, `value` is required and must be an array.
                For any other type, `value` must not be sent.
            oneOf:
                - title: Enum scope field
                  allOf:
                      - $ref: '#/components/schemas/FieldBase'
                      - type: object
                        required:
                            - value
                        properties:
                            value:
                                type: array
                                description: Allowed values for the enum field
                                items:
                                    type: string
                                example:
                                    - PSG1
                                    - PSG2
                                    - PSG3
                  example:
                      name: class
                      description: Project class
                      type: enum
                      value:
                          - PSG1
                          - PSG2
                          - PSG3
                - title: Non-enum scope field
                  allOf:
                      - $ref: '#/components/schemas/FieldBase'
                  example:
                      name: title
                      description: Scope title
                      type: string
        # ── AgreementField ──────────────────────
        AgreementField:
            description: |
                Field that defines part of the structure of an organization's agreements.
                If `type` is `enum`, `value` contains the array of allowed values.
                For any other type, `value` is not present.
            oneOf:
                - title: Enum agreement field
                  allOf:
                      - $ref: '#/components/schemas/FieldBase'
                      - type: object
                        required:
                            - value
                        properties:
                            value:
                                type: array
                                description: Allowed values for the enum field
                                items:
                                    type: string
                                example:
                                    - gold
                                    - silver
                                    - bronze
                  example:
                      name: guaranteeLevel
                      description: Service level guarantee tier
                      type: enum
                      value:
                          - gold
                          - silver
                          - bronze
                - title: Non-enum agreement field
                  allOf:
                      - $ref: '#/components/schemas/FieldBase'
                  example:
                      name: minResponseTime
                      description: Minimum response time in hours
                      type: number

        AgreementFieldInput:
            description: |
                Data to create or update an agreement field.
                If `type` is `enum`, `value` is required and must be an array.
                For any other type, `value` must not be sent.
            oneOf:
                - title: Enum agreement field
                  allOf:
                      - $ref: '#/components/schemas/FieldBase'
                      - type: object
                        required:
                            - value
                        properties:
                            value:
                                type: array
                                description: Allowed values for the enum field
                                items:
                                    type: string
                                example:
                                    - gold
                                    - silver
                                    - bronze
                  example:
                      name: guaranteeLevel
                      description: Service level guarantee tier
                      type: enum
                      value:
                          - gold
                          - silver
                          - bronze
                - title: Non-enum agreement field
                  allOf:
                      - $ref: '#/components/schemas/FieldBase'
                  example:
                      name: minResponseTime
                      description: Minimum response time in hours
                      type: number
