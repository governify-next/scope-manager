                Adds one or more roles to a specific permission (view, edit, delete, create) of the element.
                The organization and element must exist.
                The permission name must be one of `view`, `edit`, `delete` or `create`.
                The body must include a non-empty roles array.
                The roles must exist in the organization.
                Roles already present in the permission are not added again.
            requestBody:
                $ref: '#/components/requestBodies/ElementPermissionRolesBody'
            responses:
                '200':
                    description: Roles added to permission successfully
                    content:
