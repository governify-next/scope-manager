# ──────────────────────────────────────────────
# Reusable components
# ──────────────────────────────────────────────
components:
    # ── Security Schemes ─────────────────────────
    securitySchemes:
        BearerAuth:
            type: http
            scheme: bearer
            bearerFormat: JWT
            description: JWT bearer token

    # ── Parameters ────────────────────────────────
    parameters:
        orgName:
            name: orgName
            in: path
            required: true
            description: Unique name of the organization
            schema:
                type: string
            example: universidad-sevilla
        paginationPage:
            name: page
            in: query
            required: false
            description: Page number. Defaults to 1.
            schema:
                type: integer
                minimum: 1
                default: 1
            example: 1
        paginationLimit:
            name: limit
            in: query
            required: false
            description: Number of results per page. Defaults to 20.
            schema:
                type: integer
                minimum: 1
                default: 20
            example: 20
        roleName:
            name: roleName
            in: path
            required: true
            description: Name of the role within the organization
            schema:
                type: string
            example: member
        elementFieldName:
            name: fieldName
            in: path
            required: true
            description: Name of the element field
            schema:
                type: string
            example: class
        agreementFieldName:
            name: fieldName
            in: path
            required: true
            description: Name of the agreement field
            schema:
                type: string
            example: minResponseTime
        memberUsername:
            name: username
            in: path
            required: true
            description: Username of the member to remove
            schema:
                type: string
            example: janedoe
        elementName:
            name: elementName
            in: path
            required: true
            description: Unique name of the element within the organization
            schema:
                type: string
            example: L1-01
        partId:
            name: partId
            in: path
            required: true
            description: MongoDB ObjectId of the element part
            schema:
                type: string
            example: 665c2d3e4f5a6b7c8d9e0f1a
        permissionName:
            name: permissionName
            in: path
            required: true
            description: Permission type (view, edit, delete, create)
            schema:
                type: string
                enum: [view, edit, delete, create]
            example: view

    # ── Request Bodies ────────────────────────────
    requestBodies:
        OrganizationBody:
            description: |
                Data to create or update an organization.
                `name` is required, must be 3-100 characters and can only contain letters, numbers and hyphens.
                `displayName` is optional and must be at most 200 characters.
                `description` is required and must be 3-500 characters.
            required: true
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/OrganizationInput'
                    example:
                        name: universidad-sevilla
                        displayName: Universidad de Sevilla
                        description: Organization for Universidad de Sevilla
        OrganizationSearchBody:
            description: |
                Optional filters to search organizations by name, displayName or both.
                `nameOrDisplayName` searches across name and displayName and must be 1-200 characters.
                `name` must be 1-100 characters.
                `displayName` must be 1-200 characters.
            required: false
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/OrganizationSearchFilters'
                    examples:
                        byNameOrDisplayName:
                            summary: Search by name or displayName
                            value:
                                nameOrDisplayName: sevilla
                        byName:
                            summary: Search by name
                            value:
                                name: universidad-sevilla
                        byDisplayName:
                            summary: Search by displayName
                            value:
                                displayName: Universidad de Sevilla
                        byNameAndDisplayName:
                            summary: Search by name and displayName
                            value:
                                name: universidad
                                displayName: Sevilla
        RoleBody:
            description: |
                Data to create or update a role.
                `name` and `description` are required strings.
                `name` must be 3-100 characters and `description` must be 3-500 characters.
            required: true
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/RoleInput'
                    example:
                        name: member
                        description: Organization member
        MemberRolesBody:
            description: |
                Role names that must replace the member's current roles.
                If the member is the organization creator, `admin` must be included.
            required: true
            content:
                application/json:
                    schema:
                        type: array
                        description: Array of role names
                        uniqueItems: true
                        items:
                            type: string
                        example:
                            - admin
                            - member
        FieldBody:
            description: |
                Data to create or update an element field.
                `name`, `description` and `type` are required.
                `name` must be 3-100 characters and `description` must be 3-500 characters.
                If `type` is `enum`, the `value` field is required and must be an array.
                For any other type, `value` must not be sent.
            required: true
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/ElementFieldInput'
                    examples:
                        enumField:
                            summary: Enum type field
                            value:
                                name: class
                                description: Project class
                                type: enum
                                value:
                                    - PSG1
                                    - PSG2
                                    - PSG3
                        stringField:
                            summary: String type field
                            value:
                                name: title
                                description: Element title
                                type: string
        AgreementFieldBody:
            description: |
                Data to create or update an agreement field.
                `name`, `description` and `type` are required.
                `name` must be 3-100 characters and `description` must be 3-500 characters.
                If `type` is `enum`, the `value` field is required and must be an array.
                For any other type, `value` must not be sent.
            required: true
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/AgreementFieldInput'
                    examples:
                        numericField:
                            summary: Numeric guarantee field
                            value:
                                name: minResponseTime
                                description: Minimum response time in hours
                                type: number
                        enumField:
                            summary: Enum guarantee level field
                            value:
                                name: guaranteeLevel
                                description: Service level guarantee tier
                                type: enum
                                value:
                                    - gold
                                    - silver
                                    - bronze

        MemberBody:
            description: Data to add a user to an organization. The username must belong to an existing user and cannot already be a member of the organization.
            required: true
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/MemberInput'
                    example:
                        username: janedoe

        ElementBody:
            description: |
                Data to create or update an element.
                `name`, `description`, `fields`, `permissions`, `auditConfig` and `parts` are required.
                `name` must be a non-empty string with at most 100 characters.
                `description` must be a string with at most 500 characters.
                `fields` and `parts` must be arrays, `permissions` and `auditConfig` must be objects.
                Every part must include an `auditConfig` object.
                Each field name must exist in the organization's elementFields.
                Each permission value must be an array of role names that exist in the organization.
            required: true
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/ElementInput'
                    example:
                        name: L1-01
                        description: Equipo L1-01 de PSG2
                        fields: []
                        permissions:
                            view: []
                            edit: []
                            delete: []
                            create: []
                        auditConfig:
                            owner: universidad-sevilla
                            repository: L1-01-project
                        parts:
                            - auditConfig:
                                  credentials:
                                      github:
                                          username: juan

        ElementPartBody:
            description: Data to create or update an element part. The body must include an `auditConfig` object.
            required: true
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/ElementPartInput'
                    example:
                        auditConfig:
                            owner: universidad-sevilla
                            repository: L1-01-project

        ElementPermissionRolesBody:
            description: Roles to add to an element permission. The roles array is required, must not be empty and must contain strings.
            required: true
            content:
                application/json:
                    schema:
                        type: object
                        required:
                            - roles
                        properties:
                            roles:
                                type: array
                                items:
                                    type: string
                                minItems: 1
                    example:
                        roles:
                            - admin

    # ── Reusable responses ────────────────────────
    responses:
        ValidationError:
            description: Validation error in the submitted data
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/ErrorResponse'
                    example:
                        success: false
                        message: Validation error
                        httpStatus: 400
                        appCode: VALIDATION_ERROR
                        data: null
                        error:
                            message: Validation error
                            details: null
        NotFound:
            description: The requested resource does not exist
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/ErrorResponse'
                    example:
                        success: false
                        message: Resource not found
                        httpStatus: 404
                        appCode: NOT_FOUND
                        data: null
                        error:
                            message: Resource not found
                            details: null
        Conflict:
            description: A resource with that identifier already exists
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/ErrorResponse'
                    example:
                        success: false
                        message: Duplicate key error
                        httpStatus: 409
                        appCode: DUPLICATE_KEY
                        data: null
                        error:
                            message: Duplicate key error
                            details: null
        OrganizationNotFound:
            description: The organization does not exist
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/ErrorResponse'
                    example:
                        success: false
                        message: "Organization with name 'universidad-sevilla' not found"
                        httpStatus: 404
                        appCode: NOT_FOUND
                        data: null
                        error:
                            message: "Organization with name 'universidad-sevilla' not found"
                            details: null
        OrganizationConflict:
            description: An organization with that name already exists
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/ErrorResponse'
                    example:
                        success: false
                        message: An organization with that name already exists
                        httpStatus: 409
                        appCode: DUPLICATE_KEY
                        data: null
                        error:
                            message: An organization with that name already exists
                            details: null
        RoleNotFound:
            description: The role does not exist in the organization
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/ErrorResponse'
                    example:
                        success: false
                        message: "Role 'editor' not found in organization 'universidad-sevilla'"
                        httpStatus: 404
                        appCode: NOT_FOUND
                        data: null
                        error:
                            message: "Role 'editor' not found in organization 'universidad-sevilla'"
                            details: null
        RoleConflict:
            description: A role with that name already exists in the organization
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/ErrorResponse'
                    example:
                        success: false
                        message: "Role 'admin' already exists in organization 'universidad-sevilla'"
                        httpStatus: 409
                        appCode: DUPLICATE_KEY
                        data: null
                        error:
                            message: "Role 'admin' already exists in organization 'universidad-sevilla'"
                            details: null
        ElementFieldNotFound:
            description: The element field does not exist in the organization
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/ErrorResponse'
                    example:
                        success: false
                        message: "elementFields 'class' not found in organization 'universidad-sevilla'"
                        httpStatus: 404
                        appCode: NOT_FOUND
                        data: null
                        error:
                            message: "elementFields 'class' not found in organization 'universidad-sevilla'"
                            details: null
        ElementFieldConflict:
            description: An element field with that name already exists in the organization
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/ErrorResponse'
                    example:
                        success: false
                        message: "elementFields 'class' already exists in organization 'universidad-sevilla'"
                        httpStatus: 409
                        appCode: DUPLICATE_KEY
                        data: null
                        error:
                            message: "elementFields 'class' already exists in organization 'universidad-sevilla'"
                            details: null
        AgreementFieldNotFound:
            description: The agreement field does not exist in the organization
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/ErrorResponse'
                    example:
                        success: false
                        message: "agreementFields 'minResponseTime' not found in organization 'universidad-sevilla'"
                        httpStatus: 404
                        appCode: NOT_FOUND
                        data: null
                        error:
                            message: "agreementFields 'minResponseTime' not found in organization 'universidad-sevilla'"
                            details: null
        AgreementFieldConflict:
            description: An agreement field with that name already exists in the organization
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/ErrorResponse'
                    example:
                        success: false
                        message: "agreementFields 'minResponseTime' already exists in organization 'universidad-sevilla'"
                        httpStatus: 409
                        appCode: DUPLICATE_KEY
                        data: null
                        error:
                            message: "agreementFields 'minResponseTime' already exists in organization 'universidad-sevilla'"
                            details: null
        LimitExceeded:
            description: The maximum allowed limit has been reached
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/ErrorResponse'
                    example:
                        success: false
                        message: "Organization 'universidad-sevilla' has reached the maximum limit of 100 roles."
                        httpStatus: 403
                        appCode: LIMIT_EXCEEDED
                        data: null
                        error:
                            message: "Organization 'universidad-sevilla' has reached the maximum limit of 100 roles."
                            details: null
        MemberConflict:
            description: The user is already a member of the organization
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/ErrorResponse'
                    example:
                        success: false
                        message: "The user 'johndoe' already exists in organization 'universidad-sevilla'"
                        httpStatus: 409
                        appCode: DUPLICATE_KEY
                        data: null
                        error:
                            message: "The user 'johndoe' already exists in organization 'universidad-sevilla'"
                            details: null
        ElementNotFound:
            description: The element was not found in the organization
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/ErrorResponse'
                    example:
                        success: false
                        message: "Element with name 'L1-01' not found in organization"
                        httpStatus: 404
                        appCode: NOT_FOUND
                        data: null
                        error:
                            message: "Element with name 'L1-01' not found in organization"
                            details: null
        MemberNotFound:
            description: The user is not a member of the organization
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/ErrorResponse'
                    example:
                        success: false
                        message: "The user 'johndoe' does not exist in organization 'universidad-sevilla'"
                        httpStatus: 404
                        appCode: NOT_FOUND
                        data: null
                        error:
                            message: "The user 'johndoe' does not exist in organization 'universidad-sevilla'"
                            details: null
        Unauthorized:
            description: Missing or invalid authentication token
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/ErrorResponse'
                    example:
                        success: false
                        message: Authorization header missing or malformed
                        httpStatus: 401
                        appCode: UNAUTHORIZED
                        data: null
                        error:
                            message: Authorization header missing or malformed
                            details: null
        Forbidden:
            description: Insufficient permissions to perform this action
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/ErrorResponse'
                    example:
                        success: false
                        message: You do not have permission to perform that action
                        httpStatus: 403
                        appCode: FORBIDDEN
                        data: null
                        error:
                            message: You do not have permission to perform that action
                            details: null
        InternalError:
            description: Internal server error
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/ErrorResponse'
                    example:
                        success: false
                        message: Internal server error
                        httpStatus: 500
                        appCode: UNKNOWN_ERROR
                        data: null
                        error:
                            message: Internal server error
                            details: null

    # ── Schemas ───────────────────────────────────
    schemas:
        # ── Standard response ────────────────────
        SuccessResponse:
            type: object
            description: Standard wrapper for all successful API responses
            properties:
                success:
                    type: boolean
                    example: true
                message:
                    type: string
                    example: OK
                httpStatus:
                    type: integer
                    example: 200
                appCode:
                    type: string
                    example: SUCCESS
                error:
                    type: object
                    nullable: true
                    example: null
            required:
                - success
                - message
                - httpStatus
                - appCode
                - data
                - error

        OrganizationResponse:
            allOf:
                - $ref: '#/components/schemas/SuccessResponse'
                - type: object
                  properties:
                      data:
                          $ref: '#/components/schemas/Organization'

        OrganizationsResponse:
            allOf:
                - $ref: '#/components/schemas/SuccessResponse'
                - type: object
                  properties:
                      data:
                          type: array
                          items:
                              $ref: '#/components/schemas/Organization'
                      pagination:
                          $ref: '#/components/schemas/Pagination'

        MembershipResponse:
            allOf:
                - $ref: '#/components/schemas/SuccessResponse'
                - type: object
                  properties:
                      data:
                          $ref: '#/components/schemas/Membership'

        MembershipsResponse:
            allOf:
                - $ref: '#/components/schemas/SuccessResponse'
                - type: object
                  properties:
                      data:
                          type: array
                          items:
                              $ref: '#/components/schemas/Membership'

        AdminStatusResponse:
            allOf:
                - $ref: '#/components/schemas/SuccessResponse'
                - type: object
                  properties:
                      data:
                          type: object
                          required:
                              - isAdmin
                          properties:
                              isAdmin:
                                  type: boolean
                                  description: True when the authenticated user is organization admin or system admin

        NullResponse:
            allOf:
                - $ref: '#/components/schemas/SuccessResponse'
                - type: object
                  properties:
                      data:
                          type: object
                          nullable: true
                          example: null

        ElementResponse:
            allOf:
                - $ref: '#/components/schemas/SuccessResponse'
                - type: object
                  properties:
                      data:
                          $ref: '#/components/schemas/Element'

        ElementsResponse:
            allOf:
                - $ref: '#/components/schemas/SuccessResponse'
                - type: object
                  properties:
                      data:
                          type: array
                          items:
                              $ref: '#/components/schemas/Element'

        ElementPartResponse:
            allOf:
                - $ref: '#/components/schemas/SuccessResponse'
                - type: object
                  properties:
                      data:
                          $ref: '#/components/schemas/ElementPart'

        ElementPartsResponse:
            allOf:
                - $ref: '#/components/schemas/SuccessResponse'
                - type: object
                  properties:
                      data:
                          type: array
                          items:
                              $ref: '#/components/schemas/ElementPart'

        ErrorResponse:
            type: object
            description: Standard wrapper for all error API responses
            properties:
                success:
                    type: boolean
                    example: false
                message:
                    type: string
                httpStatus:
                    type: integer
                appCode:
                    type: string
                data:
                    type: object
                    nullable: true
                    example: null
                error:
                    type: object
                    properties:
                        message:
                            type: string
                        details:
                            description: Additional error information (may be null)
                            type: object
                            nullable: true
            required:
                - success
                - message
                - httpStatus
                - appCode
                - data
                - error

        Pagination:
            type: object
            description: Pagination metadata
            properties:
                page:
                    type: integer
                    example: 1
                limit:
                    type: integer
                    example: 20
                totalItems:
                    type: integer
                    example: 1
                totalPages:
                    type: integer
                    example: 1
                hasNextPage:
                    type: boolean
                    example: false
                hasPreviousPage:
                    type: boolean
                    example: false
            required:
                - page
                - limit
                - totalItems
                - totalPages
                - hasNextPage
                - hasPreviousPage

        # ── Organization ─────────────────────────
        Organization:
            type: object
            description: |
                Main container of the system. Defines the structure of its elements,
                the structure of its agreements and the available roles.
            required:
                - _id
                - name
                - description
                - createdBy
                - elementFields
                - agreementFields
                - roles
            properties:
                _id:
                    type: string
                    description: MongoDB internal identifier (ObjectId)
                    example: 665a1b2c3d4e5f6a7b8c9d0e
                name:
                    type: string
                    description: Unique organization name (used as identifier in the API). Only letters, numbers and hyphens allowed.
                    pattern: '^[a-zA-Z0-9-]+$'
                    minLength: 3
                    maxLength: 100
                    example: universidad-sevilla
                displayName:
                    type: string
                    description: Human-readable display name. Can contain any characters. Defaults to empty string.
                    maxLength: 200
                    default: ''
                    example: Universidad de Sevilla
                description:
                    type: string
                    description: Organization description
                    minLength: 3
                    maxLength: 500
                    example: Organization for Universidad de Sevilla
                createdBy:
                    type: string
                    description: ObjectId of the user that created the organization
                    example: 665d4e5f6a7b8c9d0e1f2a3b
                elementFields:
                    type: array
                    description: Fields that define the structure of elements
                    items:
                        $ref: '#/components/schemas/ElementField'
                agreementFields:
                    type: array
                    description: Fields that define the structure of agreements
                    items:
                        $ref: '#/components/schemas/AgreementField'
                roles:
                    type: array
                    description: Available roles within the organization
                    items:
                        $ref: '#/components/schemas/Role'
                members:
                    type: integer
                    description: Number of members in the organization
                    example: 1
                createdAt:
                    type: string
                    format: date-time
                    description: Creation date (auto-generated by Mongoose)
                updatedAt:
                    type: string
                    format: date-time
                    description: Last update date (auto-generated by Mongoose)
                __v:
                    type: integer
                    description: Mongoose version key
                    example: 0

        OrganizationInput:
            type: object
            description: Data required to create or update an organization
            required:
                - name
                - description
            properties:
                name:
                    type: string
                    description: Unique organization name. Only letters, numbers and hyphens allowed.
                    pattern: '^[a-zA-Z0-9-]+$'
                    minLength: 3
                    maxLength: 100
                    example: universidad-sevilla
                displayName:
                    type: string
                    description: Human-readable display name. Can contain any characters.
                    maxLength: 200
                    example: Universidad de Sevilla
                description:
                    type: string
                    description: Organization description
                    minLength: 3
                    maxLength: 500
                    example: Organization for Universidad de Sevilla

        OrganizationSearchFilters:
            type: object
            description: Optional filters available when searching organizations
            properties:
                nameOrDisplayName:
                    type: string
                    description: Case-insensitive filter applied to organization name or displayName
                    minLength: 1
                    maxLength: 200
                    example: sevilla
                name:
                    type: string
                    description: Case-insensitive filter applied to organization name
                    minLength: 1
                    maxLength: 100
                    example: universidad
                displayName:
                    type: string
                    description: Case-insensitive filter applied to displayName
                    minLength: 1
                    maxLength: 200
                    example: Sevilla

        # ── Role ─────────────────────────────────
        Role:
            type: object
            description: Role within an organization (e.g. admin, teacher, student)
            required:
                - _id
                - name
                - description
            properties:
                _id:
                    type: string
                    description: MongoDB internal identifier (subdocument ObjectId)
                    example: 665b2c3d4e5f6a7b8c9d0e1f
                name:
                    type: string
                    description: Role name (unique within the organization)
                    minLength: 3
                    maxLength: 100
                    example: admin
                description:
                    type: string
                    description: Role description
                    minLength: 3
                    maxLength: 500
                    example: Organization administrator

        RoleInput:
            type: object
            description: Data required to create or update a role
            required:
                - name
                - description
            properties:
                name:
                    type: string
                    description: Role name (unique within the organization)
                    minLength: 3
                    maxLength: 100
                    example: admin
                description:
                    type: string
                    description: Role description
                    minLength: 3
                    maxLength: 500
                    example: Organization administrator

        # ── Membership ──────────────────────────
        Membership:
            type: object
            description: Represents the relationship between a user and an organization
            required:
                - _id
                - organizationId
                - userId
                - rolesId
            properties:
                _id:
                    type: string
                    description: MongoDB internal identifier (ObjectId)
                    example: 665c3d4e5f6a7b8c9d0e1f2a
                organizationId:
                    type: string
                    description: Organization ObjectId reference
                    example: 665a1b2c3d4e5f6a7b8c9d0e
                userId:
                    type: string
                    description: User ObjectId reference
                    example: 665d4e5f6a7b8c9d0e1f2a3b
                rolesId:
                    type: array
                    description: Array of Role ObjectId references assigned to the user
                    items:
                        type: string
                    example: []
                createdAt:
                    type: string
                    format: date-time
                    description: Creation date (auto-generated by Mongoose)
                updatedAt:
                    type: string
                    format: date-time
                    description: Last update date (auto-generated by Mongoose)
                __v:
                    type: integer
                    description: Mongoose version key
                    example: 0

        MemberInput:
            type: object
            description: Data required to add a user to an organization
            required:
                - username
            properties:
                username:
                    type: string
                    description: Username of the user to add
                    example: janedoe

        # ── Element ─────────────────────────────
        Element:
            type: object
            description: An element within an organization (e.g. a team or project)
            required:
                - _id
                - name
                - description
                - organizationId
            properties:
                _id:
                    type: string
                    description: MongoDB internal identifier (ObjectId)
                    example: 665b1c2d3e4f5a6b7c8d9e0f
                name:
                    type: string
                    description: Unique element name within the organization
                    example: L1-01
                description:
                    type: string
                    example: Equipo L1-01 de PSG2
                organizationId:
                    type: string
                    description: Organization ObjectId reference
                    example: 665a1b2c3d4e5f6a7b8c9d0e
                fields:
                    type: array
                    description: Element fields (must match organization's elementFields)
                    items:
                        type: object
                    example: []
                permissions:
                    type: object
                    description: Role-based permissions for this element (arrays of role ObjectIds)
                auditConfig:
                    type: object
                    description: Audit configuration for this element
                    example:
                        owner: universidad-sevilla
                        repository: L1-01-project
                parts:
                    type: array
                    description: Sub-parts of this element, each with its own auditConfig
                    items:
                        $ref: '#/components/schemas/ElementPart'
                createdAt:
                    type: string
                    format: date-time
                updatedAt:
                    type: string
                    format: date-time
                __v:
                    type: integer
                    example: 0

        ElementPart:
            type: object
            description: A sub-part within an element
            required:
                - _id
                - auditConfig
            properties:
                _id:
                    type: string
                    description: MongoDB internal identifier (ObjectId)
                    example: 665c2d3e4f5a6b7c8d9e0f1a
                auditConfig:
                    type: object
                    description: Audit configuration for this part
                    example:
                        owner: universidad-sevilla
                        repository: L1-01-project

        ElementInput:
            type: object
            description: Payload for creating or updating an element
            required:
                - name
                - description
                - fields
                - permissions
                - auditConfig
                - parts
            properties:
                name:
                    type: string
                    minLength: 1
                    maxLength: 100
                    example: L1-01
                description:
                    type: string
                    maxLength: 500
                    example: Equipo L1-01 de PSG2
                fields:
                    type: array
                    items:
                        type: object
                    example: []
                permissions:
                    type: object
                    example:
                        view: []
                        edit: []
                        delete: []
                        create: []
                auditConfig:
                    type: object
                    example:
                        owner: universidad-sevilla
                        repository: L1-01-project
                parts:
                    type: array
                    items:
                        type: object
                        required:
                            - auditConfig
                        properties:
                            auditConfig:
                                type: object
                    example: []

        ElementPartInput:
            type: object
            description: Payload for creating or updating an element part
            required:
                - auditConfig
            properties:
                auditConfig:
                    type: object
                    description: Audit configuration for this part
                    example:
                        owner: universidad-sevilla
                        repository: L1-01-project

        # ── Base field properties (shared) ──────
        FieldBase:
            type: object
            required:
                - name
                - description
                - type
            properties:
                name:
                    type: string
                    description: Field name (unique within its array)
                    minLength: 3
                    maxLength: 100
                description:
                    type: string
                    description: Field description
                    minLength: 3
                    maxLength: 500
                type:
                    type: string
                    description: Field type
                    enum:
                        - string
                        - enum
                        - number

        # ── ElementField ─────────────────────────
        ElementField:
            description: |
                Field that defines part of the structure of an organization's elements.
                If `type` is `enum`, `value` contains the array of allowed values.
                For any other type, `value` is not present.
            oneOf:
                - title: Enum element field
                  allOf:
                      - $ref: '#/components/schemas/FieldBase'
                      - type: object
                        required:
                            - value
                        properties:
                            value:
                                type: array
                                description: Allowed values for the enum field
                                items:
                                    type: string
                                example:
                                    - PSG1
                                    - PSG2
                                    - PSG3
                  example:
                      name: class
                      description: Project class
                      type: enum
                      value:
                          - PSG1
                          - PSG2
                          - PSG3
                - title: Non-enum element field
                  allOf:
                      - $ref: '#/components/schemas/FieldBase'
                  example:
                      name: title
                      description: Element title
                      type: string

        ElementFieldInput:
            description: |
                Data to create or update an element field.
                If `type` is `enum`, `value` is required and must be an array.
                For any other type, `value` must not be sent.
            oneOf:
                - title: Enum element field
                  allOf:
                      - $ref: '#/components/schemas/FieldBase'
                      - type: object
                        required:
                            - value
                        properties:
                            value:
                                type: array
                                description: Allowed values for the enum field
                                items:
                                    type: string
                                example:
                                    - PSG1
                                    - PSG2
                                    - PSG3
                  example:
                      name: class
                      description: Project class
                      type: enum
                      value:
                          - PSG1
                          - PSG2
                          - PSG3
                - title: Non-enum element field
                  allOf:
                      - $ref: '#/components/schemas/FieldBase'
                  example:
                      name: title
                      description: Element title
                      type: string
        # ── AgreementField ──────────────────────
        AgreementField:
            description: |
                Field that defines part of the structure of an organization's agreements.
                If `type` is `enum`, `value` contains the array of allowed values.
                For any other type, `value` is not present.
            oneOf:
                - title: Enum agreement field
                  allOf:
                      - $ref: '#/components/schemas/FieldBase'
                      - type: object
                        required:
                            - value
                        properties:
                            value:
                                type: array
                                description: Allowed values for the enum field
                                items:
                                    type: string
                                example:
                                    - gold
                                    - silver
                                    - bronze
                  example:
                      name: guaranteeLevel
                      description: Service level guarantee tier
                      type: enum
                      value:
                          - gold
                          - silver
                          - bronze
                - title: Non-enum agreement field
                  allOf:
                      - $ref: '#/components/schemas/FieldBase'
                  example:
                      name: minResponseTime
                      description: Minimum response time in hours
                      type: number

        AgreementFieldInput:
            description: |
                Data to create or update an agreement field.
                If `type` is `enum`, `value` is required and must be an array.
                For any other type, `value` must not be sent.
            oneOf:
                - title: Enum agreement field
                  allOf:
                      - $ref: '#/components/schemas/FieldBase'
                      - type: object
                        required:
                            - value
                        properties:
                            value:
                                type: array
                                description: Allowed values for the enum field
                                items:
                                    type: string
                                example:
                                    - gold
                                    - silver
                                    - bronze
                  example:
                      name: guaranteeLevel
                      description: Service level guarantee tier
                      type: enum
                      value:
                          - gold
                          - silver
                          - bronze
                - title: Non-enum agreement field
                  allOf:
                      - $ref: '#/components/schemas/FieldBase'
